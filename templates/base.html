<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AI-NIDS — Network Intrusion Detection System{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-custom sticky-top">
    <div class="container-fluid">
        <a class="navbar-brand-tech text-decoration-none me-4" href="{{ url_for('dashboard') }}">
            <span class="brand-icon">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
            </span>
            <span>AI-NIDS</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#topNavbar" aria-controls="topNavbar" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        
        <div class="collapse navbar-collapse" id="topNavbar">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-1">
                <li class="nav-item">
                    <a class="nav-link-tech {% if request.path == url_for('dashboard') %}active{% endif %}" href="{{ url_for('dashboard') }}">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link-tech {% if request.path == url_for('live') %}active{% endif %}" href="{{ url_for('live') }}">Live Traffic</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link-tech {% if request.path == url_for('alerts') %}active{% endif %}" href="{{ url_for('alerts') }}">Alerts</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link-tech {% if request.path == url_for('model') %}active{% endif %}" href="{{ url_for('model') }}">Model Performance</a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-2">
                <div class="topbar-badge">
                    <span class="status-dot {% if status.active %}active{% else %}stopped{% endif %}" id="statusDot"></span>
                    <span id="monitorStatus">
                        {% if status.active %}MONITORING ACTIVE{% else %}MONITORING STOPPED{% endif %}
                    </span>
                </div>
                <div class="topbar-badge" id="liveClock">
                    📅 --/--/---- 🕒 --:--:--
                </div>
            </div>
        </div>
    </div>
</nav>

<main class="container-fluid py-4 px-lg-4">
    {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
